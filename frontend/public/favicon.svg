<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Same mark as the header logo (style/Header.css .app-header-brand::before):
       a rounded square with the accent gradient, split into 4 tiles. The gaps
       are transparent so it reads on light and dark browser tabs. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aa3bff" />
      <stop offset="1" stop-color="#6e56ff" />
    </linearGradient>
    <mask id="tiles">
      <rect width="32" height="32" fill="#fff" />
      <rect x="14.75" width="2.5" height="32" fill="#000" />
      <rect y="14.75" width="32" height="2.5" fill="#000" />
    </mask>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#g)" mask="url(#tiles)" />
</svg>
