name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:

  unit-tests:
  runs-on: ubuntu-latest
  defaults:
    run:
      working-directory: ./frontend

  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run unit tests
      run: npm run test:run


  mirror-to-epitech:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      github.repository == 'Thibani/Dashboard'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EPITECH_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Push mirror to Epitech
        run: |
          git remote add epitech git@github.com:EpitechPGE3-2026/G-WEB-500-STG-5-1-dashboard-3.git
          git push --mirror epitech